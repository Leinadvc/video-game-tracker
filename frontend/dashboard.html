<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

<div class="nav-links">

<button onclick="window.location='dashboard.html'">Dashboard</button>
<button onclick="window.location='games.html'">Games</button>
<button onclick="window.location='create-game.html'">Add Game</button>
